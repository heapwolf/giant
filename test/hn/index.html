<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIANT News</title>
  <style>
    body { font-family: Verdana, Geneva, sans-serif; background: #f6f6ef; margin: 0; padding: 0; color: #828282; }
    .container { width: 85%; max-width: 1200px; margin: 0 auto; background: #f6f6ef; }
    header { background: #ff6600; padding: 4px; display: flex; align-items: center; color: #000; font-weight: bold; }
    .logo { border: 1px solid #fff; padding: 2px 6px; margin-right: 8px; color: #fff; text-decoration: none; }
    main { padding: 10px; background: #f6f6ef; }
    .story-wrapper { margin-bottom: 12px; }
    .story { display: flex; align-items: baseline; }
    .rank { width: 30px; text-align: right; margin-right: 5px; }
    .title { color: #000; text-decoration: none; font-size: 14px; }
    .domain { font-size: 10px; margin-left: 5px; color: #828282; text-decoration: none; }
    .domain:hover { text-decoration: underline; }
    .meta { font-size: 10px; margin-left: 40px; margin-top: 2px; }
    .meta a { color: #828282; text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    .more-btn { margin-left: 40px; margin-top: 10px; background: none; border: none; color: #828282; cursor: pointer; font-family: inherit; font-size: 14px; padding: 0; }
    .more-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <giant-news></giant-news>

  <script type="module" src="./index.js"></script>
</body>
</html>
